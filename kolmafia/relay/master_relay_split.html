<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Master Relay Split Chat</title>
<style>
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#fff;font-family:Arial,Helvetica,sans-serif}
#kmr-stage{position:absolute;inset:0;display:flex;flex-direction:column;min-width:0;min-height:0}
.kmr-pane{width:100%;min-height:0;overflow:hidden;background:#fff}
#kmr-integrated{flex:1 1 auto}
#kmr-gcli{flex:0 0 25%}
.kmr-pane iframe{display:block;width:100%;height:100%;border:0;margin:0;padding:0;background:#fff}
#kmr-divider{position:relative;flex:0 0 9px;width:100%;height:9px;cursor:row-resize;background:#dedede;border-top:1px solid #aaa;border-bottom:1px solid #aaa;box-sizing:border-box;z-index:4}
#kmr-divider:before{content:"";position:absolute;top:3px;left:calc(50% - 28px);height:1px;width:56px;background:#888;box-shadow:0 2px 0 #aaa}
#kmr-collapse{position:absolute;right:8px;top:-7px;width:21px;height:21px;padding:0;border:1px solid #777;border-radius:2px;background:#fff;color:#111;font:700 12px/19px Arial,Helvetica,sans-serif;cursor:pointer;z-index:5}
#kmr-collapse:hover,#kmr-collapse:focus{background:#e8f0ff;outline:1px solid #315f9f;outline-offset:-2px}
#kmr-shield{display:none;position:fixed;inset:0;z-index:99999;cursor:row-resize;background:rgba(0,0,0,0)}
body.kmr-dragging #kmr-shield{display:block}
body.kmr-collapsed #kmr-gcli{display:none}
body.kmr-collapsed #kmr-integrated{flex:1 1 auto!important}
body.kmr-collapsed #kmr-divider{cursor:default}
body.kmr-collapsed #kmr-divider:before{display:none}
</style>
</head>
<body>
<div id="kmr-stage">
  <section id="kmr-integrated" class="kmr-pane" aria-label="KoLmafia integrated Chat and gCLI">
    <iframe src="/chat.html" title="Integrated Chat and gCLI"></iframe>
  </section>
  <div id="kmr-divider" role="separator" aria-orientation="horizontal" aria-label="Drag to resize gCLI pane">
    <button id="kmr-collapse" type="button" title="Collapse or restore the gCLI pane" aria-label="Collapse or restore gCLI pane">▼</button>
  </div>
  <section id="kmr-gcli" class="kmr-pane" aria-label="Persistent gCLI pane">
    <iframe src="/cli.html" title="Persistent gCLI"></iframe>
  </section>
</div>
<div id="kmr-shield"></div>
<script>
(function(){
  "use strict";
  var KEY_GCLI_PERCENT="kol-topmenu-gcli.split.gcli.percent";
  var KEY_COLLAPSED="kol-topmenu-gcli.split.gcli.collapsed";
  var gcli=document.getElementById("kmr-gcli");
  var divider=document.getElementById("kmr-divider");
  var collapse=document.getElementById("kmr-collapse");
  var shield=document.getElementById("kmr-shield");
  var dragging=false;
  var lastGcliPercent=25;

  function clamp(value){return Math.max(12,Math.min(60,value));}
  function readGcliPercent(){
    try{var v=parseFloat(localStorage.getItem(KEY_GCLI_PERCENT));return isFinite(v)?clamp(v):25;}catch(e){return 25;}
  }
  function writeGcliPercent(value){try{localStorage.setItem(KEY_GCLI_PERCENT,String(value));}catch(e){}}
  function readCollapsed(){try{return localStorage.getItem(KEY_COLLAPSED)==="1";}catch(e){return false;}}
  function writeCollapsed(value){try{localStorage.setItem(KEY_COLLAPSED,value?"1":"0");}catch(e){}}
  function applyGcliPercent(value){
    lastGcliPercent=clamp(value);
    gcli.style.flex="0 0 "+lastGcliPercent+"%";
    writeGcliPercent(lastGcliPercent);
  }
  function setCollapsed(value){
    value=!!value;
    document.body.className=value?"kmr-collapsed":"";
    collapse.textContent=value?"▲":"▼";
    collapse.title=value?"Restore gCLI pane":"Collapse gCLI pane";
    divider.style.cursor=value?"default":"row-resize";
    writeCollapsed(value);
    if(!value)applyGcliPercent(lastGcliPercent);
  }
  function eventY(e){
    if(e.touches&&e.touches.length)return e.touches[0].clientY;
    return e.clientY;
  }
  function move(e){
    if(!dragging)return;
    if(e.preventDefault)e.preventDefault();
    var height=document.documentElement.clientHeight||document.body.clientHeight||1;
    var gcliPercent=((height-eventY(e))/height)*100;
    applyGcliPercent(gcliPercent);
  }
  function stop(e){
    if(!dragging)return;
    dragging=false;
    document.body.className=document.body.className.replace(/\s*kmr-dragging\b/g,"");
    if(e&&e.preventDefault)e.preventDefault();
  }
  function start(e){
    if(document.body.className.indexOf("kmr-collapsed")!==-1)return;
    dragging=true;
    if(document.body.className.indexOf("kmr-dragging")===-1)document.body.className+=" kmr-dragging";
    if(e.preventDefault)e.preventDefault();
  }

  divider.onmousedown=start;
  divider.ontouchstart=start;
  shield.onmousemove=move;
  shield.ontouchmove=move;
  shield.onmouseup=stop;
  shield.ontouchend=stop;
  window.onmouseup=stop;
  window.ontouchend=stop;
  collapse.onclick=function(e){
    if(e&&e.stopPropagation)e.stopPropagation();
    setCollapsed(document.body.className.indexOf("kmr-collapsed")===-1);
    return false;
  };

  lastGcliPercent=readGcliPercent();
  applyGcliPercent(lastGcliPercent);
  setCollapsed(readCollapsed());
})();
</script>
</body>
</html>
